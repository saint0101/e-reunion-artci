# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name meeting.artci.ci www.meeting.artci.ci;
    return 301 https://$host$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl;
    http2 on;

    server_name meeting.artci.ci www.meeting.artci.ci;

    # ✅ Certificat principal
    ssl_certificate /etc/nginx/ssl/artci.ci.crt;

    # ✅ Clé privée (OBLIGATOIRE)
    ssl_certificate_key /etc/nginx/ssl/star.artci.ci.key;

    # ✅ Chaîne intermédiaire (CORRECT)
    # ssl_trusted_certificate /etc/nginx/ssl/intermediate_artci.ci.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/meeting_artci_access.log;
    error_log /var/log/nginx/meeting_artci_error.log warn;

    # Static files
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Reverse proxy Django
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}