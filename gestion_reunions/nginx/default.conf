############################################
# Redirection HTTP → HTTPS
############################################
server {
    listen 80;
    server_name meeting.artci.ci;

    return 301 https://$host$request_uri;
}

############################################
# HTTPS principal
############################################
server {
    listen 443 ssl;
    http2 on;

    server_name meeting.artci.ci;

    ########################################
    # SSL
    ########################################
    ssl_certificate     /etc/nginx/ssl/artci.ci.crt;
    ssl_certificate_key /etc/nginx/ssl/star.artci.ci.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ########################################
    # Limites & logs
    ########################################
    client_max_body_size 50M;

    access_log /var/log/nginx/meeting_artci_access.log;
    error_log  /var/log/nginx/meeting_artci_error.log warn;

    ########################################
    # Static files
    ########################################
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /media/;
        expires 30d;
        access_log off;
    }

    ########################################
    # Reverse proxy vers Django
    ########################################
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_redirect off;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}