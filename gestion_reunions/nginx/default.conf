############################################
# Redirection HTTP vers HTTPS
############################################
server {
    listen 80;
    server_name meeting.artci.ci www.meeting.artci.ci 196.216.227.105;
    
    # Redirection vers HTTPS
    return 301 https://$host$request_uri;
}

############################################
# HTTPS principal
############################################
server {
    listen 443 ssl;
    http2 on;
    server_name meeting.artci.ci www.meeting.artci.ci;

    # Certificats SSL
    ssl_certificate /etc/nginx/ssl/artci.ci.crt;
    ssl_certificate_key /etc/nginx/ssl/star.artci.ci.key;
    
    # Certificat intermédiaire (optionnel - commenté si absent)
    # ssl_trusted_certificate /etc/nginx/ssl/intermediate_artci.ci.crt;

    # Paramètres SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/meeting_artci_access.log;
    error_log /var/log/nginx/meeting_artci_error.log warn;

    ########################################
    # Static files
    ########################################
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    ########################################
    # Reverse proxy vers Django
    ########################################
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}