<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe réinitialisé - QR Meeting</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --orange-primary: #FF6B35; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--orange-primary), #ff8c5a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 460px; width: 100%; }
        .btn-primary { background: var(--orange-primary); border: none; border-radius: 8px; }
        .btn-primary:hover { background: #e55a2b; }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5 mx-3 text-center">
        <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
        <h4 class="mb-2">Mot de passe réinitialisé !</h4>
        <p class="text-muted">
            Votre mot de passe a été modifié avec succès.
            Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg mt-3">
            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
        </a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
