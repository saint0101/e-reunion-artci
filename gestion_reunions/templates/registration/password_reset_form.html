<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - QR Meeting</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --orange-primary: #FF6B35; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--orange-primary), #ff8c5a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 460px; width: 100%; }
        .btn-primary { background: var(--orange-primary); border: none; border-radius: 8px; }
        .btn-primary:hover { background: #e55a2b; }
        .form-control { border-radius: 8px; border: 1px solid #e0e0e0; padding: 0.75rem 1rem; }
        .form-control:focus { border-color: var(--orange-primary); box-shadow: 0 0 0 0.2rem rgba(255,107,53,0.25); }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5 mx-3">
        <div class="text-center mb-4">
            <i class="fas fa-envelope-open-text fa-3x text-warning mb-3"></i>
            <h4 class="mb-1">Mot de passe oublié ?</h4>
            <p class="text-muted small">
                Saisissez votre adresse email. Si un compte lui est associé,
                vous recevrez un lien pour réinitialiser votre mot de passe.
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label">
                    <i class="fas fa-envelope me-1"></i>Adresse email
                </label>
                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="votre.email@artci.ci"
                       required autofocus>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-paper-plane me-2"></i>Envoyer le lien de réinitialisation
                </button>
            </div>
        </form>

        <div class="text-center">
            <a href="{% url 'login' %}" class="text-muted small">
                <i class="fas fa-arrow-left me-1"></i>Retour à la connexion
            </a>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
