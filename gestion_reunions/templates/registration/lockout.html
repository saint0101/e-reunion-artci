<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte verrouillé - QR Meeting</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --orange-primary: #FF6B35; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--orange-primary), #ff8c5a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 460px; width: 100%; }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5 mx-3 text-center">
        <i class="fas fa-lock fa-4x text-danger mb-3"></i>
        <h4 class="mb-2">Compte temporairement verrouillé</h4>
        <p class="text-muted">
            Trop de tentatives de connexion infructueuses ont été détectées.
            Réessayez dans une heure ou contactez l'administrateur.
        </p>
        <a href="{% url 'password_reset' %}" class="btn btn-outline-secondary mt-3">
            <i class="fas fa-key me-1"></i>Mot de passe oublié ?
        </a>
    </div>
</body>
</html>
