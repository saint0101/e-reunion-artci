############################################
# Redirection HTTP → HTTPS
############################################
server {
    listen 80;
    server_name meeting.artci.ci;

    return 301 https://$host$request_uri;
}

############################################
# HTTPS principal
############################################
server {
    listen 443 ssl;
    http2 on;

    server_name meeting.artci.ci;

    ########################################
    # SSL
    ########################################
    # ssl_certificate     /etc/nginx/ssl/artci.ci.crt;
    # ssl_certificate_key /etc/nginx/ssl/star.artci.ci.key;
    
    ssl_certificate     /etc/nginx/ssl/meeting_full_chain.crt;
    #ssl_certificate     /etc/nginx/ssl/meeting_full_chain.crt;
   
    ssl_certificate_key /etc/nginx/ssl/star.artci.ci.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ########################################
    # Limites & logs
    ########################################
    client_max_body_size 50M;

    access_log /var/log/nginx/meeting_artci_access.log;
    error_log  /var/log/nginx/meeting_artci_error.log warn;

    ########################################
    # Static files
    ########################################
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        access_log off;
    }

    # Media (P7.2 / R1) : seuls les QR codes sont publics. Les comptes-rendus
    # ne sont servis qu'après contrôle des droits par Django (X-Accel-Redirect).
    location /media/qr_codes/ {
        alias /media/qr_codes/;
        expires 30d;
    }

    location /media/ {
        return 404;
    }

    location /protected-media/ {
        internal;
        alias /media/;
    }
	########################################
	# Reverse proxy vers Django
	########################################
    location = /accounts/register/ { return 404; }
    location ^~ /accounts/backups/ { return 404; }
    # Exports rouverts le 15/10/2026 : vue protégée (login + rôle) et SSRF ReportLab corrigée
    #location ~ ^/reunion/[0-9]+/export-presence/ { return 404; }
	location / {
	    # proxy_pass http://web:80;
	    proxy_pass http://web:8000;
	
	    proxy_set_header Host              $host;
	    proxy_set_header X-Real-IP         $remote_addr;
	    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	
	    # IMPORTANT : ne pas forcer 443 ici
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header X-Forwarded-Port  $server_port;
	
	    proxy_set_header X-Forwarded-Host  $host;
	
	    proxy_redirect off;
	
	    proxy_read_timeout 300;
	    proxy_connect_timeout 300;
	    proxy_send_timeout 300;
	}

	########################################
	# Reverse proxy vers Django
	########################################

	#location / {
	#    proxy_pass http://web:80;
	#
	#    proxy_set_header Host              $host;
	#    proxy_set_header X-Real-IP         $remote_addr;
	#    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	#
	#    # IMPORTANT : ne pas forcer 443 ici
	#    proxy_set_header X-Forwarded-Proto $scheme;
	#    proxy_set_header X-Forwarded-Port  $server_port;
	#
	#    proxy_set_header X-Forwarded-Host  $host;
	#
	#    proxy_redirect off;
