version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: artci_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gestion_reunions}
      POSTGRES_USER: ${DB_USER:-e_reunion_artci}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_ereunion@20.25}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db_backup:/backup
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - edcp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-e_reunion_artci} -d ${DB_NAME:-gestion_reunions}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: artci_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edcp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Django
  web:
    build: .
    container_name: artci_e_reunion
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-this}
      DATABASE_URL: postgresql://${DB_USER:-e_reunion_artci}:${DB_PASSWORD:-postgres_ereunion@20.25}@db:5432/${DB_NAME:-gestion_reunions}
      DB_NAME: ${DB_NAME:-gestion_reunions}
      DB_USER: ${DB_USER:-e_reunion_artci}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_ereunion@20.25}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1

      # Email
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: qrmeeting@artci.ci
      EMAIL_HOST_PASSWORD: "Admin/QR25"
      DEFAULT_FROM_EMAIL: qrmeeting@artci.ci

      # Site configuration pour HTTPS
      SITE_NAME: "Plateforme e-REUNION ARTCI"
      TITLE_PREFIX: "eREUNION"
      SITE_PORT: ""
      SITE_PROTOCOL: "https://"
      SITE_ADDRESS: "www.meeting.artci.ci"
      DEFAULT_LIST_SIZE: "10"
      
      # IMPORTANT: Autoriser tous les hôtes nécessaires
      ALLOWED_HOSTS: "127.0.0.1,localhost,172.16.0.153,196.216.227.105,meeting.artci.ci,www.meeting.artci.ci"
      
      # Configuration SSL/HTTPS
      SECURE_SSL_REDIRECT: "True"
      SECURE_PROXY_SSL_HEADER: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      
      # Variables pour le superutilisateur
      CREATE_SUPERUSER: "true"
      DJANGO_SUPERUSER_USERNAME: "admin"
      DJANGO_SUPERUSER_EMAIL: "admin@artci.ci"
      DJANGO_SUPERUSER_PASSWORD: "admin123"
      
    volumes:
      - ./media:/app/media
      - ./static:/app/static
      - ./logs:/app/logs
      - staticfiles_volume:/app/staticfiles
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edcp_network
    restart: unless-stopped

  # NGINX (REVERSE PROXY avec SSL)
  nginx:
    image: nginx:1.25-alpine
    container_name: artci_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/staticfiles:ro
      - ./media:/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - edcp_network
    restart: unless-stopped

# Volumes
volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  staticfiles_volume:
    driver: local

# Réseau
networks:
  edcp_network:
    driver: bridge